<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Surf 웹게임 프로토타입 테스트 공간" />
    <meta name="theme-color" content="#102c35" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Surf · Prototype</title>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">PLAYGROUND / 001</p>
          <h1>Surf<span>Prototype</span></h1>
        </div>
        <p class="status" id="status" role="status">엔진 초기화 중</p>
      </header>
      <section aria-labelledby="play-title">
        <div class="section-heading">
          <h2 id="play-title">작은 실험의 시작</h2>
          <p>Phaser 렌더링과 입력을 확인하는 테스트 화면입니다.</p>
        </div>
        <div id="game" tabindex="0" role="group" aria-label="게임 테스트 화면" aria-describedby="controls"></div>
        <div class="toolbar">
          <p id="controls">화면을 클릭하거나 터치해 이동하세요. 화면 선택 후 방향키 / WASD로도 움직일 수 있습니다.</p>
          <button id="reset" type="button">위치 초기화 ↗</button>
        </div>
      </section>
      <footer><span>SURF LAB</span><span>아이디어를 플레이로.</span></footer>
    </main>
    <noscript>이 프로토타입을 실행하려면 JavaScript를 활성화해 주세요.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
